<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Geometry matched to public/brand-mark-transparent.png (dev login standard). -->
  <defs>
    <linearGradient id="cm-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D72E8"/>
      <stop offset="100%" stop-color="#1D72E8"/>
    </linearGradient>
    <linearGradient id="cm-r" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F01681"/>
      <stop offset="100%" stop-color="#F01681"/>
    </linearGradient>
    <!-- Left: large lightly-offset hole → open ring (same weight as brand-mark PNG) -->
    <mask id="cm-mask-l">
      <rect width="100" height="64" fill="white"/>
      <circle cx="35" cy="32" r="21.5" fill="black"/>
    </mask>
    <!-- Right: slot + lower half-disk → smile -->
    <mask id="cm-mask-r">
      <rect width="100" height="64" fill="white"/>
      <rect x="46" y="30" width="44" height="4" fill="black"/>
      <path d="M 53 32 a 15 15 0 0 0 30 0 Z" fill="black"/>
    </mask>
    <clipPath id="cm-clip-l">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>
  <g transform="translate(0, 18)">
    <circle cx="32" cy="32" r="28" fill="url(#cm-l)" mask="url(#cm-mask-l)"/>
    <circle cx="68" cy="32" r="28" fill="url(#cm-r)" mask="url(#cm-mask-r)"/>
    <g clip-path="url(#cm-clip-l)">
      <circle cx="68" cy="32" r="28" fill="#0D1B82" mask="url(#cm-mask-r)"/>
    </g>
  </g>
</svg>
