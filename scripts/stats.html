<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  #row {
    width: 1100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 10px 12px;
    font-family: Inter, system-ui, sans-serif;
    color: #0f172a;
    background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
    border: 1px solid #e2e8f0;
    border-radius: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 0;
  }
  .icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .i1 { background: #f5f3ff; border: 1px solid #ddd6fe; color: #7c3aed; }
  .i2 { background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; font-weight: 800; }
  .i3 { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
  .i4 { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
  .text { min-width: 0; }
  .num { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #0f172a; text-transform: uppercase; margin-top: 1px; }
  .sub { font-size: 10px; color: #94a3b8; margin-top: 1px; line-height: 1.2; }
  .c1 .num { color: #7c3aed; }
  .c2 .num { color: #059669; }
  .c3 .num { color: #dc2626; }
  .c4 .num { color: #2563eb; }
</style>
</head>
<body>
<div id="row">
  <div class="card c1">
    <div class="icon i1">🌐</div>
    <div class="text">
      <div class="num">16</div>
      <div class="lbl">Tools</div>
      <div class="sub">10 EN + 6 中文</div>
    </div>
  </div>
  <div class="card c2">
    <div class="icon i2">{ }</div>
    <div class="text">
      <div class="num">SAME</div>
      <div class="lbl">JSON shape</div>
      <div class="sub">stable across all tools</div>
    </div>
  </div>
  <div class="card c3">
    <div class="icon i3">〰</div>
    <div class="text">
      <div class="num">MANDARIN</div>
      <div class="lbl">Sandhi-aware tones</div>
      <div class="sub">tones + sandhi</div>
    </div>
  </div>
  <div class="card c4">
    <div class="icon i4">🔌</div>
    <div class="text">
      <div class="num">TRANSPORT</div>
      <div class="lbl">MCP + FC fallback</div>
      <div class="sub">streaming + inline</div>
    </div>
  </div>
</div>
</body>
</html>
