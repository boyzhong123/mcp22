<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  #row {
    width: 1100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 8px 10px;
    font-family: Inter, system-ui, sans-serif;
    color: #0f172a;
    background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
    border: 1px solid #e2e8f0;
    border-radius: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
  }
  .icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .i1 { background: #f5f3ff; border: 1px solid #ddd6fe; }
  .i2 { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .i3 { background: #fef2f2; border: 1px solid #fecaca; }
  .i4 { background: #eff6ff; border: 1px solid #bfdbfe; }
  .num { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .lbl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; color: #64748b; text-transform: uppercase; }
  .sub { font-size: 10px; color: #94a3b8; margin-top: -2px; }
  .c1 .num { color: #7c3aed; }
  .c2 .num { color: #059669; }
  .c3 .num { color: #dc2626; }
  .c4 .num { color: #2563eb; }
</style>
</head>
<body>
<div id="row">
  <div class="card c1">
    <div class="icon i1">🌐</div>
    <div class="num">16 TOOLS</div>
    <div class="lbl">Catalog</div>
    <div class="sub">10 EN + 6 中文</div>
  </div>
  <div class="card c2">
    <div class="icon i2">{ }</div>
    <div class="num">SAME JSON</div>
    <div class="lbl">Shape</div>
    <div class="sub">stable across all tools</div>
  </div>
  <div class="card c3">
    <div class="icon i3">〰️</div>
    <div class="num">MANDARIN</div>
    <div class="lbl">Tones</div>
    <div class="sub">sandhi-aware scoring</div>
  </div>
  <div class="card c4">
    <div class="icon i4">🔌</div>
    <div class="num">TRANSPORT</div>
    <div class="lbl">Dual mode</div>
    <div class="sub">MCP + FC fallback</div>
  </div>
</div>
</body>
</html>
