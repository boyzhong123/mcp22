<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #row {
    width: 1100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 8px 10px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
    border: 1px solid #e2e8f0;
    border-radius: 16px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .i-globe { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .i-map   { background: #f5f3ff; border: 1px solid #ddd6fe; }
  .i-people{ background: #eff6ff; border: 1px solid #bfdbfe; }
  .i-bolt  { background: #fffbeb; border: 1px solid #fde68a; }
  .num {
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.04em; color: #0f172a;
    line-height: 1;
    white-space: nowrap;
  }
  .lbl {
    font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.08em; color: #64748b;
    text-transform: uppercase; white-space: nowrap;
    line-height: 1.1;
  }
</style>
</head>
<body>
<div id="row">
  <div class="card">
    <div class="icon i-globe">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.8 3.2 2.8 14.8 0 18M12 3c-2.8 3.2-2.8 14.8 0 18"/>
      </svg>
    </div>
    <div class="num">9.2B+</div>
    <div class="lbl">Evals / year</div>
  </div>
  <div class="card">
    <div class="icon i-map">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7l6-2 6 2 6-2v14l-6 2-6-2-6 2V7z"/>
        <path d="M9 5v14M15 7v14"/>
      </svg>
    </div>
    <div class="num">185</div>
    <div class="lbl">Countries</div>
  </div>
  <div class="card">
    <div class="icon i-people">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="9" r="3"/>
        <circle cx="16" cy="10" r="2.4"/>
        <path d="M3 19c0-3 3-5 6-5s6 2 6 5M14 19c0-2.2 2-3.6 4-3.6s3 1 3 3"/>
        <path d="M11.2 7.2l1.2 1.2 2.2-2.4"/>
      </svg>
    </div>
    <div class="num">95%+</div>
    <div class="lbl">Human agreement</div>
  </div>
  <div class="card">
    <div class="icon i-bolt">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
      </svg>
    </div>
    <div class="num">&lt;200ms</div>
    <div class="lbl">P99 first token</div>
  </div>
</div>
</body>
</html>
